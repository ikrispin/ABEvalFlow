apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: evaluate
  labels:
    app.kubernetes.io/name: abevalflow
    app.kubernetes.io/component: konflux
spec:
  description: >-
    Evaluation phase for Konflux integration. Submits the evaluation as a
    remote Pod on the workload cluster (cn-ai-lab) where the agent, LiteLLM,
    and Harbor infrastructure are co-located. Waits for completion and
    retrieves results back to the Konflux workspace.
  params:
    - name: eval-engine
      type: string
      default: "a2a"
      description: Evaluation engine (harbor, ase, mcpchecker, a2a, both)
    - name: submission-dir
      type: string
      description: Submission directory name under submissions/
    - name: submission-name
      type: string
      description: Validated submission name
    - name: commit-sha
      type: string
      default: ""
      description: Git commit SHA for provenance
    - name: pipeline-run-id
      type: string
      description: PipelineRun name
    - name: pipeline-repo-url
      type: string
      default: "https://github.com/ikrispin/ABEvalFlow.git"
    - name: pipeline-repo-revision
      type: string
      default: "main"
    - name: eval-base-image
      type: string
      default: "quay.io/rh-ee-ikrispin/abevalflow-eval-base:latest"
      description: Eval base image with Harbor pre-installed
    - name: llm-model
      type: string
      default: "claude-sonnet"
    - name: llm-api-base
      type: string
      default: "http://litellm.ab-eval-flow.svc:4000"
    - name: llm-api-key
      type: string
      default: "sk-dummy"
    - name: agent-endpoint
      type: string
      default: ""
      description: A2A agent endpoint URL (cluster-internal svc URL)
    - name: agent-timeout
      type: string
      default: "120"
    - name: workload-cluster-url
      type: string
      default: "https://api.cn-ai-lab.2vn8.p1.openshiftapps.com:6443"
    - name: workload-namespace
      type: string
      default: "ab-eval-flow"
    - name: eval-timeout
      type: string
      default: "1800"
      description: Seconds to wait for the eval Pod to complete
  workspaces:
    - name: source
      description: Workspace containing the cloned submissions repository
  results:
    - name: treatment-mean-reward
      description: Treatment/with-skill mean reward
    - name: control-mean-reward
      description: Control/without-skill mean reward
    - name: recommendation
      description: Pass or fail recommendation
    - name: results-dir
      description: Path to evaluation results
  steps:
    - name: submit-eval
      image: registry.redhat.io/openshift4/ose-cli:latest
      env:
        - name: WORKLOAD_TOKEN
          valueFrom:
            secretKeyRef:
              name: workload-cluster-credentials
              key: token
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        echo "=== EVALUATE PHASE: Submit Remote Eval ==="

        CLUSTER_URL="$(params.workload-cluster-url)"
        NAMESPACE="$(params.workload-namespace)"
        OC="oc --server=$CLUSTER_URL --token=$WORKLOAD_TOKEN --insecure-skip-tls-verify=true"

        EVAL_ENGINE="$(params.eval-engine)"
        SUBMISSION_NAME="$(params.submission-name)"
        SUBMISSION_DIR="$(params.submission-dir)"
        AGENT_ENDPOINT="$(params.agent-endpoint)"
        RUN_ID=$(echo "$(params.pipeline-run-id)" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | cut -c1-20)
        POD_NAME="eval-job-${RUN_ID:-$(date +%s)}"

        echo "Engine: $EVAL_ENGINE"
        echo "Submission: $SUBMISSION_NAME"
        echo "Agent endpoint: $AGENT_ENDPOINT"
        echo "Eval pod: $POD_NAME"
        echo "Workload cluster: $CLUSTER_URL"

        # Write defaults for results
        echo -n "0.0" > "$(results.treatment-mean-reward.path)"
        echo -n "0.0" > "$(results.control-mean-reward.path)"
        echo -n "fail" > "$(results.recommendation.path)"
        RESULTS_DIR="$(workspaces.source.path)/eval-results/$SUBMISSION_NAME"
        mkdir -p "$RESULTS_DIR"
        echo -n "$RESULTS_DIR" > "$(results.results-dir.path)"

        cat <<PODSPEC | $OC apply -n $NAMESPACE -f -
        apiVersion: v1
        kind: Pod
        metadata:
          name: $POD_NAME
          namespace: $NAMESPACE
          labels:
            abevalflow/temp: "true"
            abevalflow/type: eval-job
        spec:
          restartPolicy: Never
          activeDeadlineSeconds: $(params.eval-timeout)
          containers:
          - name: eval
            image: $(params.eval-base-image)
            command: ["/bin/bash", "-c"]
            args:
            - |
              set -euo pipefail
              export HOME=/tmp
              export PYTHONHTTPSVERIFY=0

              echo "=== Remote Eval Pod Starting ==="
              echo "Engine: $EVAL_ENGINE"
              echo "Agent: $AGENT_ENDPOINT"

              # Clone ABEvalFlow
              git clone --depth 1 --branch "$(params.pipeline-repo-revision)" \
                "$(params.pipeline-repo-url)" /tmp/abevalflow
              cd /tmp/abevalflow
              export PYTHONPATH=/tmp/abevalflow

              SUBMISSION_PATH="/tmp/abevalflow/submissions/$SUBMISSION_DIR"
              RESULTS_DIR="/tmp/eval-results"
              REPORT_DIR="/tmp/eval-reports"
              mkdir -p "\$RESULTS_DIR" "\$REPORT_DIR"

              if [ "$EVAL_ENGINE" = "a2a" ]; then
                # Read trial count from metadata
                N_ATTEMPTS=\$(python3 -c "
              import yaml
              try:
                  meta = yaml.safe_load(open('\$SUBMISSION_PATH/metadata.yaml'))
                  print(meta.get('experiment', {}).get('n_trials', 5))
              except:
                  print(5)
              ")

                # Find task directory
                TASK_DIR=""
                if [ -f "\$SUBMISSION_PATH/task.toml" ]; then
                  TASK_DIR="\$SUBMISSION_PATH"
                elif [ -d "\$SUBMISSION_PATH/tasks" ]; then
                  for subdir in "\$SUBMISSION_PATH/tasks"/*/; do
                    if [ -f "\${subdir}task.toml" ]; then
                      TASK_DIR="\${subdir%/}"
                      break
                    fi
                  done
                fi

                if [ -z "\$TASK_DIR" ]; then
                  echo "ERROR: No task.toml found"
                  exit 1
                fi

                echo "Task: \$(basename \$TASK_DIR) | Attempts: \$N_ATTEMPTS"

                # Generate Harbor config
                python3 - "\$RESULTS_DIR" "\$TASK_DIR" "\$N_ATTEMPTS" "$AGENT_ENDPOINT" "$(params.agent-timeout)" "$(params.llm-api-base)" "openai/$(params.llm-model)" <<'GENCFG'
              import sys, yaml
              results_dir, task_dir, n_attempts, endpoint, timeout, llm_api_base, llm_model = sys.argv[1:8]
              config = {
                  "job_name": "a2a-eval",
                  "jobs_dir": results_dir,
                  "n_attempts": int(n_attempts),
                  "agents": [{"import_path": "abevalflow.harbor_agents.a2a_adapter:A2AAgent", "kwargs": {"endpoint": endpoint, "timeout": int(timeout)}}],
                  "tasks": [{"path": task_dir}],
                  "environment": {"type": "local"},
                  "verifier": {"env": {"LLM_JUDGE_MODEL": llm_model, "LLM_API_BASE": llm_api_base, "OPENAI_API_KEY": "sk-dummy"}}
              }
              with open(results_dir + "/config.yaml", "w") as f:
                  yaml.dump(config, f, default_flow_style=False)
              GENCFG

                python3 -c "from abevalflow.harbor_agents.a2a_adapter import A2AAgent; print('A2AAgent imported OK')"

                harbor run -c "\$RESULTS_DIR/config.yaml" -y 2>&1 || true

                # Show exceptions if any
                find "\$RESULTS_DIR" -name "exception.txt" -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null || true

                # Compute mean reward
                python3 - "\$RESULTS_DIR" <<'COMPUTE'
              import json, sys
              from pathlib import Path
              results_dir = Path(sys.argv[1])
              rewards = []
              for f in sorted(results_dir.rglob("result.json")):
                  try:
                      data = json.loads(f.read_text())
                      vr = data.get("verifier_result") or {}
                      rw = vr.get("rewards") or {}
                      reward = rw.get("reward") or vr.get("reward")
                      if reward is not None:
                          rewards.append(float(reward))
                  except:
                      pass
              mean_reward = sum(rewards) / len(rewards) if rewards else 0.0
              rec = "pass" if mean_reward >= 0.5 else "fail"
              result = {"mean_reward": mean_reward, "recommendation": rec, "n_trials": len(rewards)}
              Path("/tmp/eval-summary.json").write_text(json.dumps(result))
              print(json.dumps(result, indent=2))
              COMPUTE
              fi

              echo "=== Remote Eval Pod Complete ==="
            env:
            - name: HOME
              value: /tmp
            - name: LLM_JUDGE_MODEL
              value: "openai/$(params.llm-model)"
            - name: LLM_BASE_URL
              value: "$(params.llm-api-base)"
            - name: LLM_API_BASE
              value: "$(params.llm-api-base)"
            - name: OPENAI_API_KEY
              value: "$(params.llm-api-key)"
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: "1"
                memory: 2Gi
        PODSPEC

        echo "Eval pod submitted. Waiting for completion..."

        TIMEOUT=$(params.eval-timeout)
        POLL_INTERVAL=15
        ELAPSED=0

        while [ $ELAPSED -lt $TIMEOUT ]; do
          PHASE=$($OC get pod $POD_NAME -n $NAMESPACE -o jsonpath='{.status.phase}' 2>/dev/null || echo "Unknown")
          case "$PHASE" in
            Succeeded)
              echo "Eval pod completed successfully (${ELAPSED}s)"
              break
              ;;
            Failed)
              echo "Eval pod failed (${ELAPSED}s)"
              $OC logs $POD_NAME -n $NAMESPACE 2>&1 | tail -30
              break
              ;;
            *)
              printf "."
              sleep $POLL_INTERVAL
              ELAPSED=$((ELAPSED + POLL_INTERVAL))
              ;;
          esac
        done
        echo ""

        if [ $ELAPSED -ge $TIMEOUT ]; then
          echo "TIMEOUT: Eval pod did not complete in ${TIMEOUT}s"
          $OC logs $POD_NAME -n $NAMESPACE 2>&1 | tail -30
          $OC delete pod $POD_NAME -n $NAMESPACE --ignore-not-found=true
          exit 1
        fi

        echo "=== Retrieving results ==="
        $OC logs $POD_NAME -n $NAMESPACE 2>&1 | tee /tmp/eval-pod-logs.txt

        SUMMARY=$(grep -A5 '"mean_reward"' /tmp/eval-pod-logs.txt | head -6 || echo "")
        if [ -n "$SUMMARY" ]; then
          echo "$SUMMARY" > /tmp/eval-summary-extracted.json
          MEAN_REWARD=$(python3 -c "import json; print(json.loads(open('/tmp/eval-summary-extracted.json').read().strip())['mean_reward'])" 2>/dev/null || echo "0.0")
          REC=$(python3 -c "import json; print(json.loads(open('/tmp/eval-summary-extracted.json').read().strip())['recommendation'])" 2>/dev/null || echo "fail")
          echo -n "$MEAN_REWARD" > "$(results.treatment-mean-reward.path)"
          echo -n "0.0" > "$(results.control-mean-reward.path)"
          echo -n "$REC" > "$(results.recommendation.path)"
          echo "Mean reward: $MEAN_REWARD"
          echo "Recommendation: $REC"
        else
          echo "WARNING: Could not extract eval summary from pod logs"
        fi

        $OC delete pod $POD_NAME -n $NAMESPACE --ignore-not-found=true
        echo "=== Evaluate phase complete ==="
