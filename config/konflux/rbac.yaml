---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: abevalflow-integration
  namespace: ai5-marketplace-tenant
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: abevalflow-integration
  namespace: ai5-marketplace-tenant
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "delete", "get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: abevalflow-integration
  namespace: ai5-marketplace-tenant
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: abevalflow-integration
subjects:
  - kind: ServiceAccount
    name: abevalflow-integration
    namespace: ai5-marketplace-tenant
